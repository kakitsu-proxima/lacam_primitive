grid:
  cell_size: 0.05
  origin: [0.0, 0.0]
  width_cells: 52
  height_cells: 20
  heading_bins: 4
  macro_dt: 0.20

robot:
  size: [0.825, 0.275] # [length, width] in m
  max_linear_velocity: 3.0 # m/s
  max_angular_velocity: 8.0 # rad/s
  collision_padding: 0.01

primitives:
  #translation_cells: [1, 2, 3, 4, 5]
  translation_cells: [1, 2, 3, 4, 5, 6]
  rotation_bins: 1
  #rotation_pivot_offsets_cells: [-5, 0, 5]
  rotation_pivot_offsets_cells: [-5, 0, 5]
  include_wait: true

search:
  time_limit_ms: 1000
  anytime: true
  initial_weight: 10.0
  minimum_weight: 1.0
  weight_step: 0.2
  objective: sum_of_costs
  max_expansions: 200000
  max_branching: 8
  alternatives_per_agent: 4
  random_seed: 7

obstacles: []
#  - rect: [0, 0, 28, 1]
#  - rect: [0, 11, 28, 1]
#  - rect: [0, 0, 1, 12]
#  - rect: [27, 0, 1, 12]

agents:
  - start: [9, 3, 0]
    goal: [48, 10, 1]
  - start: [48, 10, 1]
    goal: [9, 16, 0]
  - start: [9, 16, 0]
    goal: [35, 10, 1]